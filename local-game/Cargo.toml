[package]
name = "local-game"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs a game with computer players in-process, without a server"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shengji-core = { path = "../core" }
shengji-mechanics = { path = "../mechanics" }
shengji-types = { path = "../backend/backend-types" }
slog = "2.5"
