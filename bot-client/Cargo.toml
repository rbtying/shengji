[package]
name = "shengji-bot"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shengji-core = { path = "../core" }
shengji-types = { path = "../backend/backend-types" }
tokio = { version = "1.28", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-tungstenite = "0.24"
